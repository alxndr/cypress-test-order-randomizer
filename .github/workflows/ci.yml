name: CI

on:
  push:
  pull_request:

jobs:

  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # Slow job: builds dist/ then runs 7 Cypress processes (~6 min).
  # Runs after `validate` so a lint/typecheck/unit failure cancels the run
  # before spending 6 min on Cypress. To run both jobs in parallel instead
  # (faster wall-clock time, similar billed minutes), remove the `needs` line.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Cache the Cypress binary so it isn't re-downloaded on every run.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Packages required by Cypress's bundled Electron browser on Ubuntu 24.04.
      # Package names with the t64 suffix are Ubuntu 24.04's 64-bit time_t variants.
      - name: Install Cypress system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk2.0-0t64 \
            libgtk-3-0t64 \
            libgbm-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            libasound2t64 \
            xvfb

      # --ignore-scripts skips Cypress's postinstall (which downloads the binary).
      # We install the binary explicitly in the next step instead.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: npx cypress install

      - name: Build and run E2E tests
        run: npm run test:e2e
