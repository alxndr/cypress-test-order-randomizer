name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Lint/typecheck/unit-test tooling (oxlint, TypeScript, Vitest) has its own
  # Node floor, which can be — and currently is — higher than engines.node in
  # package.json (the floor for actually *running* the published plugin).
  # oxlint@1.73.0 requires Node ^20.19.0 || >=22.12.0, above our 22.2.0 floor;
  # pinning this job to a single recent version sidesteps that mismatch rather
  # than fighting it. The e2e job below is what actually exercises engines.node
  # across versions, since it builds and runs the real plugin against Cypress.
  validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts # intentionally using --ignore-scripts to cut down on NPM vuln 'blast radius'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    # NOTE: This job only runs if `validate` succeeds
    name: E2E Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [validate]
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          # Stable: failures block the run.
          # Add new versions as they reach LTS; drop them when they go EOL.
          #
          # '22.2.0' pins the literal floor from engines.node in package.json —
          # '22' alone would resolve to the latest 22.x patch (via check-latest
          # below) and never actually exercise the claimed minimum.
          - node-version: '22.2.0'
            experimental: false
          - node-version: '22'
            experimental: false
          - node-version: '24'
            experimental: false
          # Current, not yet LTS (expected ~Oct 2026): failures are visible
          # but do not block the run.
          - node-version: '26'
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: 'npm'

      # Cache the Cypress binary so it isn't re-downloaded on every run.
      - name: Cache Cypress binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Packages required by Cypress's bundled Electron browser on Ubuntu 24.04.
      # Package names with the t64 suffix are Ubuntu 24.04's 64-bit time_t variants.
      - name: Install Cypress system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk2.0-0t64 \
            libgtk-3-0t64 \
            libgbm-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            libasound2t64 \
            xvfb

      # --ignore-scripts skips Cypress's postinstall (which downloads the binary).
      # We install the binary explicitly in the next step instead.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: npx cypress install

      - name: Build and run E2E tests
        run: npm run test:e2e
